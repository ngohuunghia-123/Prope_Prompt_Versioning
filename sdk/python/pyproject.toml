[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prope-sdk"
version = "0.1.0"
description = "Call governed prompts through Prope's gateway. The request travels to the prompt."
readme = "README.md"
# 3.10 rather than the service's pinned 3.13 (ADR-0026), because this runs in a
# CUSTOMER's process at a version Prope does not control — see OQ-152. The floor
# is what `X | None` in annotations needs alongside `from __future__ import
# annotations`, which every module here has.
requires-python = ">=3.10"
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# `httpx` and nothing else. ADR-0065: the SDK does NOT depend on `openai` —
# wrapping somebody else's client imports their release cadence into Prope's
# support surface, and a stack trace from a customer's process has to be
# readable without knowing which version of a third-party library they pinned.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["prope_sdk"]

[tool.ruff]
line-length = 120
# py310 rather than the repository's py313: this package runs in a CUSTOMER's
# process (OQ-152), so lint has to hold at the floor the package claims.
target-version = "py310"

# The same rule set as the repository's `ruff.toml`, so one policy governs both
# distributables. A second, laxer policy for the package customers actually
# install would be exactly the wrong way round.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: line length is handled by the formatter, as in the repository root.
#
# N818: the exception names deliberately mirror the gateway's own error CODES —
# `model_not_found` -> `ModelNotFound`, `system_message_not_allowed` ->
# `CallerSystemMessage`. A customer reading `model_not_found` in a log and
# `ModelNotFound` in a traceback connects the two without a lookup table, and
# appending `Error` to every one of them would buy PEP 8 conformance at the cost
# of the correspondence that makes the vocabulary learnable. The base class
# `PropeError` does carry the suffix, so the convention is honoured where it is
# load-bearing: `except PropeError` catches everything this package raises.
ignore = ["E501", "N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
