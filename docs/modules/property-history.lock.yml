ready_at: 2026-08-09
# Set 2026-08-09, after OQ-017 was answered. This module was held back by exactly one checklist line -
# "no unresolved critical or high finding from passes 1-4" - and OQ-017 was that finding. It is now
# resolved (ADR-0054, A-151) and every other line was already passing, each checked against the parsed
# file rather than by reading: no open question with severity blocker, no TBD marker remains, every INT
# reference resolves to a registered seam, at least three acceptance criteria carry test_refs, at least
# three failure modes carry detection + impact + mitigation, all seven test_plan categories non-empty,
