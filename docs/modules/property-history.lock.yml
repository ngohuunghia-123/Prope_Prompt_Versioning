provenance:
  created_by: agent
  change_log:
    - "2026-08-08 — Initial lock, and the eighth of eight. Almost every field was already determined by
       the seven locks before it, so the work was reconciliation rather than design, and the
       reconciliation found four things. (1) Five lock files promise their history append is 'synchronous,
       same transaction as the state change', and no arrangement except an in-process library delivers
       that — an HTTP service, a queue, and a trigger each break it in a different way. Written down as
       ADR-0023, because that sentence in five other files is only true because of it. (2) The five event
       lists use two naming schemes: release-control's six bare verbs (`approved`, `released`) against
       everyone else's subject-first form. Renamed to `revision_approved`, `revision_released`, and so on,
       and amended in release-control's lock (A-120). (3) A prompt's Activity view spans events from four
       modules and six target types, and this module may join to none of their tables — resolved with a
       `scope_prompt_id` stamped at write time, which is free where it is known and impossible where it
       is needed (A-119). (4) `00_context.md#success` measures restore time from an event named
       `restore_requested` that no module writes, and its other half is a `call_record` this module may
       not read — recorded as A-126 and flagged for the step-6 sweep. Also settled the payload question
       that A-044's six fields force: a JSON `details` column with keys allow-listed per action, because
       it would otherwise be the one shapeless column in Prope written by five modules and the most
       likely place a prompt body ends up (ADR-0024). And gave 'append-only' teeth — a database privilege
       rather than an intention, the same call BR-03 got and for the same reason (ADR-0025).
       0 blocking questions raised; 8 new agent decisions recorded as A-119..A-126; 3 ADRs written."
    - "2026-08-09 — Step 4, first module of the per-module pass. Language, database, and backup rows
       filled; `language_runtime`, `deployment_target` and `libraries_frameworks` written. Four of six
       rows were already determined by step 3 or the global baseline; the three real decisions were
       backup mechanism (ADR-0036, which ADR-0033 had explicitly deferred to this pass), who runs a
       cross-workspace read now that ADR-0035 makes `prope_app` RLS-subject (ADR-0037 — A-126's hand-run
       SQL would otherwise have used the one credential that can DELETE a history row), and the action
       registry's cache lifecycle (ADR-0038, Prope's fourth caching decision). Two findings worth the
       record: `off-host` backup collides with OQ-011's residency resolution unless the destination is
       group-controlled, which is why object storage is rejected and A-131 names the gap; and the
       `n/a` web-framework row is made structural rather than asserted — the module does not import
       FastAPI, so AC-7's route-table assertion is guarding something that is already impossible.
       ADR-0025's hash-chain rejection was NOT re-opened. `ready_for_build` stays false; step 5 fills
       `contract_ref` and the step-6 sweep flips it."
    - "2026-08-09 - Step 5 (interfaces). Six contract_refs filled and no interface_refs, because
       outputs is [] - it calls nothing and notifies nobody, which is the property that lets
       access-control depend on it without a cycle. INT-006 append() - INT-007 read() -
       INT-008 registered_actions(). This module is the only provider with no HTTP seam and no /healthz,
       and INT-030 records that absence as an entry rather than a gap: it has no process of its own, and
       a route here would reintroduce the cycle A-044 broke. The failure semantics worth having in one
       place: INT-006 RAISES AND THE RAISE IS THE MECHANISM - an unregistered action or an unregistered
       details key aborts the caller's transaction, so the state change and its record are atomic by
       construction, and a caller that catches it has broken the product's central claim. There is no
       log-and-continue path and no dead-letter, deliberately. INT-007 checks no permission and HAS NO
       WAY TO; RLS is the backstop there, not the control."
    - >-
        "2026-08-09 - Step 6 (the five-pass sweep). Passes 1-5 ran over all eight locks in order.
        Pass 1 corrected the events comment. Pass 2 confirmed this module owns the two tables nothing else may write and fed A-145 - history_event is the retention term that is unbounded BY DESIGN rather than by omission. Pass 3 wrote T-021..T-024; T-021 is this module's reason to exist and its test is only half the control, the other half being T-001 in access-control, and each file now names the other. Pass 4 confirmed the empty dependency list is still empty.

        NORMALISATION, and it is the finding that made the rest checkable: this file did not parse as
        YAML. Prose scalars containing ': ' or a wrapped line beginning with '#' were being read as
        mapping keys or as comments, which meant every earlier step's claim about this file rested on
        reading it rather than on loading it. 25 scalars were converted to folded block form; no word
        of prose changed, asserted by comparing the word bag of the file before and after. The pass-5
        checklist below was then run by a parser rather than by eye, which is the only reason it can be
        trusted.

