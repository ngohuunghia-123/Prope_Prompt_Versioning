        works where a name-shaped one could not: the syntactic case is decided with zero reads, the
        namespaced case is decided against the workspace's namespace set, and the scope check stops
        pre-empting the question because scope and entry rule are now expressed in the same unit. It is
        also STRICTLY SAFER than the obvious repair. Reordering resolve ahead of the scope check - the
        one-line fix - leaks: `finance/pricing` refuses and `finance/nothing` forwards, which is registry
        enumeration through the observe door, charged to the victim's provider account per probe.
        Deciding at the namespace refuses both, and A-159 prices the residue: a leaked key learns which
        namespaces exist and never which names.

