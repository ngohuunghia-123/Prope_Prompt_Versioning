       libraries_frameworks filled, each citing its governing ADR.

       THREE THINGS THIS PASS FOUND.

       (1) `revision` had no workspace_id. It was reachable only through prompt_id, so ADR-0035's
       original enumeration — tables ALREADY CARRYING the column — could not see the table holding every
       prompt body in Prope. That is the fourth child-table-with-only-a-parent-FK in five passes, after
       call_body, prompt_grant and credential. It is also the FIRST one caught with no decision
       required: ADR-0045 inverted the rule one pass earlier, so this surfaced as a coverage-test
       failure and a one-line migration rather than as something a human had to notice. No ADR written,
       which is the outcome ADR-0045 exists to produce.

       (2) Search had two undecided halves, both of which change the schema. WHICH body — body lives on
       `revision`, and the load condition says 20 revisions per property, so 'search the body' was a 20x
       ambiguity (640 MB vs 32 MB of indexed text at A-050's cap) sitting on the only number written
       down. And WHAT A MATCH MEANS — A-013 says 'substrings', which tsvector does not do. ADR-0048
       decides both: a trigger-maintained prompt_property.search_text holding title | purpose | tags |
       the latest body | EVERY revision's change summary, indexed with pg_trgm GIN and queried with
       ILIKE. tsvector lost on three specifics, not on taste: it needs a stemming dictionary named while
       OQ-010's answer leaves no bundled Vietnamese dictionary to name (ADR-0053, A-150), it cannot match
       infixes, and its parser reads namespace/name as a file path — so
       'refund' would miss support/refund-classifier, the most likely query in this product. The trigger
       rather than application code because drift is silent and wrong in the unsafe direction. ADR-0002
       is untouched: the trigger fires on the revision INSERT and writes the parent, which was already
       mutable — and ADR-0002 forbidding UPDATE on revision is precisely what ruled out an is_latest
       flag and forced the denormalised column.

       (3) The 5-minute model catalogue cache in failure_modes was deleted, not relocated. Under
       ADR-0026 and ADR-0033 this module and provider-access are the same process, so get_model_catalogue
       is a local table read and 'provider-access is unavailable' is not a state that can exist. The
       cache added a staleness window to a read that had none, and would have existed twice once worker
       imports this module — the defect ADR-0046 repaired in provider-access one pass earlier. The
       failure mode is rewritten to what can actually happen (a failed upstream refresh), the Cache row
       is `n/a`, and the gateway's 30 s TTL is now the only staleness in the whole read path.

       ALSO: an LLM keyword-extractor / summariser on save and a vector store were raised by the user,
       grilled, and rejected for the MVP — out of scope by declaration, and architecturally because they
       would put a model dispatch on the WRITE PATH of the register, spend the workspace's own BYOK
       credential unasked, send every body upstream at save time including drafts and retired prompts,
       and index the register on a model's non-deterministic opinion. ADR-0048 records the argument and
       an ordered upgrade ladder (simple-dictionary tsvector, then pg_trgm similarity ranking, then
       pgvector computed in worker on a schedule and never on the save path), so the question has a
       written answer next time. The change summaries now in search_text are the cheap, human-authored
       version of what the extractor was reaching for.

       WRITTEN: ADR-0048; A-136 (a restore loses up to 24 h of prompt text and the history proves the
       loss without recovering it); 3 stack fields; 2 table amendments (search_text, workspace_id); 1
       failure mode rewritten and 3 added; 5 security requirements added; AC-7..AC-11 recorded as owed to
       the step-6 sweep; adrs +12; assumptions +4. difflib with autojunk=False recorded as a minor
       library choice with no ADR, per the step-4 skill."
