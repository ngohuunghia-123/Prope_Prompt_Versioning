provenance:
  created_by: agent
  change_log:
    - "2026-08-13 — Initial lock drafted from module_map.md and user decisions:
      (1) pgvector for semantic search — existing in stack.
      (2) On-demand indexing — user clicks 'Index this prompt' after approval.
      (3) Quick search (keyword, all prompts) + AI search (semantic, indexed only).
      (4) Agent-extracted metadata: keywords, topics, entities, variations, language.
      (5) App Agent separate from user's BYOK — app-owned SaaS LLM (gpt-4o-mini).
      (6) Duplicate detection at index time (>90% → warning).
      (7) Clustering reserved for future work."
    - "2026-08-14 — 0.2.0. The extraction agent reworked onto DSPy + Langfuse,
      matching prompt-conversion:
      (1) `agent/dspy_program.py` — a typed `dspy.Signature` replaces the
          f-string prompt, the unconstrained `chat.completions` call and the
          hand-rolled ```-fence stripper. Untrusted input is delimited by the
          chat adapter's field markers rather than concatenated.
      (2) `agent/prompting.py` — the instruction is a Langfuse `production`
          version with an in-code fallback, and now carries an explicit SECURITY
          BOUNDARY clause. The previous prompt had none, while interpolating a
          stored prompt body written to instruct a different model.
      (3) `agent/evaluation.py` + `agent/datasets/` — a deterministic quality
          score on every live extraction and a 12-record synthetic golden set.
      (4) `agent/optimize.py` — offline compile; publishes UNLABELLED only.
      (5) Seven new metrics, five new alerts, Langfuse tracing on both the
          preview and indexing paths.
      (6) The shared LM, its `cache=False` security setting, the token
          accounting and the Langfuse client moved to `prope.app_agent` so the
          two agents cannot drift apart.
      (7) Fixed: `worker` had no LANGFUSE_* env, so the indexing path — the main
          consumer of this agent — could not have been traced at all.
      (8) Fixed: `observability._observed_terminal_jobs` was an unbounded set
          that grew for the life of the `app` process; now a bounded ring.
      (9) Raised, not fixed: the `index_*_total` label cardinality debt above."
