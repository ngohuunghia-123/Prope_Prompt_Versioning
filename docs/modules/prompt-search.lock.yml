module:
  module_id: prompt-search
  title: Prompt Search
  context: Prompt Search
  kind: FEATURE
  size: M
  version: 0.3.0
  last_updated: >-
    2026-08-15

purpose: |
  Provide two search modes for prompts: a fast keyword search across all prompts (indexed or not), and
  an AI-powered semantic search over indexed prompts only. Indexing is on-demand — the author clicks
  "Index this prompt" after approval — so only production-ready prompts are searchable by similarity.
  An App Agent (separate from the user's configured LLM provider) extracts structured metadata
  (keywords, topics, entities, multilingual variations) at index time, enabling both keyword precision
  and semantic recall. Duplicate detection runs at index time, surfacing near-matches before they
  are created.
  See docs/brainstorm/00_context.md#scope ("Semantic/vector search, duplicate clustering" deferred
  from prompt-registry).

scope:
  in_scope:
    - >-
      Quick search: keyword match on title, purpose, tags, and body across ALL prompts (indexed or
      not). Instant, no AI required. This is the default search mode.
    - >-
      AI search: semantic similarity over indexed prompts only. Triggered by clicking "Search with
      AI". Uses pgvector embeddings of the prompt's purpose.
    - >-
      On-demand indexing: "Index this prompt" button appears on approved prompts. The author
      triggers metadata extraction and embedding generation. Indexing is never forced.
    - >-
      Agent-extracted metadata at index time: keywords, topics, entities, multilingual variations,
      detected language(s). Stored in JSONB for flexibility. Used by keyword search and returned
      in AI search results.
    - >-
      App Agent for extraction: a dedicated SaaS LLM (gpt-4o-mini) owned by the app, separate
      from the user's configured provider. Costs borne by the app, isolated from user quotas.
    - >-
      App embedding model: text-embedding-3-small (OpenAI), owned by the app. Separate from
      user's generation model.
    - >-
      Duplicate detection at index time: compute nearest-neighbor similarity; if >90%, surface
      a warning in the index preview. Does not block indexing.
    - >-
      Hybrid results for AI search: keyword match signals boost semantic similarity scores.
    - >-
      Index status on prompts: indexed_at, indexed_by, index version. Show in prompt detail.
    - >-
      Re-index on new revision: "This version is not indexed" prompt when viewing an approved
      prompt that has a newer revision.
  non_goals:
    - >-
      REVERSED. "Semantic search without prior indexing. AI search only returns indexed prompts."
      The index is an ACCELERATOR, not a gate. AI search now ranks every visible prompt through two
      legs: pgvector cosine over `prompt_search_index`, and the distinctive terms of the query probed
      against `registry.prompt_property.search_text` — the trigram-indexed document the registry's
      trigger already fills with the latest revision's body. An unindexed prompt is therefore found,
      marked `is_indexed: false` with `matched_fields: [lexical]`, and ranked below any genuine
      vector match by `LEXICAL_CEILING`. What indexing buys is precision and speed, not visibility.
      Results below `MIN_SEARCH_SIMILARITY` are dropped: cosine distance answers for every row, so
      without a floor a query matching nothing returns the least-unrelated prompts in the workspace
      and the import dialog presents them as near-duplicates.
    - Deciding who may search. Delegated to access-control's permission checks.
    - Clustering or auto-grouping prompts. Reserved for future work (re-indexing feeds it).
    - Modifying prompt bodies. This module reads a body to index it and never writes one.
    - Agent-assisted search queries. Only indexing uses the App Agent; search uses embeddings.
    - >-
      REVERSED. "Forcing indexing on every save. Indexing is on-demand only." held while the corpus
      existed to make RELEASED prompts findable. The import screen changed what it is for: a
      duplicate check that only knows released prompts cannot warn about the draft somebody imported
      an hour ago, and a workspace whose prompts are all unreleased - every new workspace - had an
      empty corpus and got "nothing resembles this" for every import. Saving a revision now publishes
      an indexing job (prompt-registry, through `seams`, after the transaction, soft). On-demand
      indexing remains: the button still exists and is still the only way to index a RELEASE.

inputs:
  - from: prompt-registry
    what: >-
      read prompt property and its revisions — title, purpose, body, tags, status. Indexing
      reads the body to extract metadata AND to embed; the vector covers title + purpose + body
      (`index_document`), not purpose alone. Embedding the purpose alone is what made the import
      screen's duplicate check useless — it compared a pasted instruction against one-line
      descriptions. A prompt holds at most two index rows, `latest` and `released` (migration 0014);
      only the `released` row requires an approved, currently-released revision.
    transport: in-process read via repository (no direct table join)
    contract_ref: "prompt_registry.repository.list_prompts/load_prompt/load_revision"
  - from: App Agent (external SaaS LLM)
    what: >-
      prompt body + purpose text; returns the six typed fields of
      `agent.dspy_program.MetadataExtraction` — keywords, topics, entities,
      variations_en, variations_vi, language — which `metadata_of` assembles into
      ExtractedMetadata. The nested {en: [], vi: []} shape is built by code, not
      returned by the model.
    transport: HTTPS to OpenAI / Anthropic API
    contract_ref: "OpenAI Chat Completions JSON validated by ExtractionResult"
  - from: prompt-registry (lexical leg)
    what: >-
      `list_prompts(keyword=...)` per distinctive query term — substring match over the
      trigram-indexed, diacritic-folded `search_text`, which contains namespace/name, title,
      purpose, tags and the latest revision body. This is what makes an UNINDEXED prompt findable.
      Bounded by MAX_SEARCH_TERMS so one search costs a fixed number of indexed queries.
    transport: in-process read via repository (no direct table join)
    contract_ref: "registry_repository.list_prompts — visibility filter applied by the seam"
  - from: Embedding Service (external)
    what: text string; returns float array embedding
    transport: HTTPS to OpenAI Embeddings API
    contract_ref: "OpenAI Embeddings vector(1536), EMBEDDING_MODEL"

outputs:
  - to: prompt detail UI
    interface_ref: "GET /api/v1/prompts/{prompt_id}/index"
    what: >
      stores extracted metadata and embedding against a prompt version. The index record is owned
      by this module; prompt-registry reads it for the "indexed" badge.
  - to: access-control
    interface_ref: "access_control.may and visible_subject_filter"
    what: every search request carries the actor; this module resolves permission through
      access-control.may() before returning results. Results are filtered at the repository layer.

apis:
  exposes:
    - "GET  /api/v1/prompts/search?q={query}&type={quick|ai}&cursor={cursor} — search prompts.
      type=quick: keyword search on all prompts the actor may see. type=ai: hybrid search over
      every visible prompt. Cursor-paginated. Both return: {prompts: [], next_cursor?,
      total?, search_type: 'quick'|'ai'}. Results carry matched_fields and, where there is one,
      a similarity.
      **type=quick is TOKENISED and RANKED (0.3.0).** It was neither: the whole query string
      became one substring match, so any multi-word query returned nothing at all, and
      single-word queries came back in prompt_id order with no scoring step. Measured over
      the golden set, the default search mode scored 0.000 on every metric
      (eval/result/*-baseline.json). It now probes the distinctive terms of the query and
      ranks by the share of the query's inverse-document-frequency mass a prompt accounts
      for. Its `similarity` is that share — a term-overlap number, NOT a cosine — and the SPA
      renders a percentage only for type=ai."
    - "POST /api/v1/prompts/search/similar — rank indexed prompts against a whole prompt body,
      for the duplicate check the import screen runs before a prompt is created. Body:
      {text (1..32768 chars), limit (1..10, default 3)}. Returns the same shape as the AI search
      above, with search_type: 'ai' and next_cursor: null — a top-N probe, not a paged list.
      Exists because the GET route takes its query in ?q= and caps it at 500 characters, which
      is a search box's length and not a prompt's.
      **Corrected in 0.3.0**: this entry said 'ranks INDEXED prompts only and compares against
      the purpose embedding'. Neither has been true since migration 0014 and the hybrid
      rewrite — it ranks every visible prompt, and the vector covers the whole prompt. An
      empty result means 'nothing here resembles this', which is still not the same claim as
      'this is not a duplicate'; the caller is still required to say so.
      A row matched on wording alone carries `similarity: null`, never a number: the dialog
      renders that field as 'N% similar', and a term-overlap share of 1.0 for an unindexed
      prompt would read as a certain duplicate."
    - "GET  /api/v1/prompts/{prompt_id}/index — return index status: {is_indexed, is_stale,
      indexed_at?, indexed_by?, version_id?, nearest_neighbor?: {prompt_id, title, similarity?}}.
      is_indexed means SOMETHING in the corpus represents this prompt, not that the released
      revision does — a draft indexed under `latest` ranks in search and must not report itself
      as unindexed. is_stale carries the rest: the newest revision is not the indexed one, or the
      vector came from a different embedding model than the one configured (vectors from two
      models are not comparable). Both are reasons to re-index; neither means invisible."
    - "POST /api/v1/prompts/{prompt_id}/index — trigger indexing for the current approved revision.
      Returns 202 Accepted with {job_id}. The extraction runs async; poll job status or use
      webhook. Requires actor has write permission on the prompt."
    - "GET  /api/v1/prompts/{prompt_id}/index/preview — dry-run: extract metadata without
      storing. Shows what would be indexed and any duplicate warnings. Good for review before
      committing."
    - "DELETE /api/v1/prompts/{prompt_id}/index — remove index for this prompt. Does not delete
      the prompt. Useful when a prompt is retired or the author wants to de-index."
  consumes:
    - "access-control: may(actor, action, subject) — on every search and index endpoint"
    - "access-control: visible_subject_filter(actor, 'prompt') -> {mode: all | none | ids}
      — pushed into the repository's WHERE clause. Same pattern as prompt-registry INT-002."

events:
  publishes:
    - topic: prope.prompt_indexed
      what: "{prompt_id, version_id, indexed_by, keywords_count, topics_count,
        nearest_neighbor_id?, nearest_neighbor_similarity?}"
      when: after successful index write
    - topic: prope.prompt_deindexed
      what: "{prompt_id, deindexed_by}"
      when: after index removed
  subscribes: []

data:
  owns:
    - table: prompt_search_index
      fields: >
        prompt_id, version_id, workspace_id, keywords, topics, entities, variations,
        language, role, content_embedding, is_bilingual, indexed_at, indexed_by,
        embedding_model, nearest_neighbor_id, nearest_neighbor_similarity
      notes: |
        id prefix psi_, workspace_id present for RLS (ADR-0035).
        prompt_id references prompt_property.id (not enforced FK — prompt-registry owns it).
        version_id records which revision was indexed; a new revision does not auto-reindex.
        content_embedding: VECTOR(1536) over the document `domain.build_index_document` assembles,
          NOT purpose alone and — since 0.3.0 — not the raw body either. The document leads with
          title, extracted topics, keywords and entities, then the purpose, then the body cut to
          DOCUMENT_CHARACTER_LIMIT (12,000 characters). Two reasons: on a corpus of documents in
          one genre a mean-pooled whole-body vector is dominated by the genre, and the extraction
          is a model-written compression of the same prompt that the job already paid for.
          Worth +0.10 hit@1 on cluster-discrimination queries, measured. The cut also closes a
          latent failure: a 32,768-character body has no token bound at all, and the embedding
          models here accept 8,191 — reachable in Vietnamese, which ADR-0053 makes the interface
          language. PROMPT_SEARCH_INDEX_DOCUMENT=legacy restores the old document.
          role: 'latest' | 'released', unique per (prompt_id, role) — at most two rows per
          prompt, so a draft is findable without overwriting what production serves.
        nearest_neighbor fields are computed at index time via pgvector cosine distance against
        existing embeddings. Not updated on subsequent inserts — only on re-index.
        keywords, topics, entities: TEXT[] for GIN index (any or overlap).
        variations: JSONB to allow structured {en: [], vi: []} with language as top-level array.
        is_bilingual: true when language array has both 'en' and 'vi'.
      amended: |
        2026-08-13 — initial design.
    - table: prompt_search_index_job
      fields: job_id, prompt_id, version_id, status, started_at, completed_at, error,
        result_json, created_by
      notes: |
        id prefix psj_. Tracks async indexing job lifecycle: pending | running | completed | failed.
        workspace_id is present for RLS. result_json stores a non-sensitive completion summary;
        extracted metadata remains only in prompt_search_index.
        Completed jobs are kept for 7 days for debugging; failed jobs kept indefinitely.
  reads:
    - "prompt-registry: prompt_property, revision — read-only, no cross-module joins"
    - "access-control: visible_subject_filter() — repository-level permission filtering"
  writes_tables_it_does_not_own: none

external_services:
  - service: OpenAI API
    purpose: App Agent (gpt-4o-mini) for metadata extraction and text-embedding-3-small for
      embeddings. Owned by the app, not by user's provider.
    auth: APP_OPENAI_API_KEY env var, separate from user BYOK credentials. Embeddings may live on a
      different OpenAI-compatible host entirely — EMBEDDING_BASE_URL / EMBEDDING_API_KEY /
      EMBEDDING_MODEL, each falling back to its APP_* counterpart when empty — because a gateway
      serving /chat/completions need not serve /embeddings.
    retry: exponential backoff, 3 retries, circuit breaker if >50% failure rate
    note: "No provider fallback. The App Agent model is configurable via APP_AGENT_MODEL env var;
      the embedding model via EMBEDDING_MODEL. Changing the latter marks every existing index STALE,
      which is correct: vectors from two models were never comparable."

dependencies:
  - module: prompt-registry
    criticality: hard
    reason: Search indexes prompts from the registry; index status is displayed on prompt detail.
      Indexing reads approved revisions.
  - module: access-control
    criticality: hard
    reason: Every search and index operation checks permission. Results are filtered per actor.
  - module: pgvector (infrastructure)
    criticality: hard
    reason: Semantic search and nearest-neighbor computation. Already deployed in the stack.

forbidden_dependencies:
  - module: evaluation
    reason: This module indexes prompts for discovery; evaluation runs against the result.
      The dependency runs the other way.
  - module: gateway
    reason: Gateway resolves prompts at runtime; this module provides the search surface.
      No call path needed either direction.
  - module: call-ledger
    reason: Call records have no role in prompt discovery. Keeping the edge absent.

language_runtime:
  language: Python
  version: "3.13.x, pinned"
  reason: |
    Inherited from the baseline (ADR-0026). FastAPI for the HTTP surface. The async extraction
    job runs in the `worker` process alongside other background work (ADR-0028).

deployment_target: |
  The `app` container serves the HTTP surface (6 routes plus /healthz and /readyz). The async
  extraction job runs in `worker` (ADR-0028) from the dedicated durable
  `prope.prompt_search.index` queue. Both are from the same image.
  No dedicated container. No cron job — indexing is event-driven (user action).

libraries_frameworks: |
  FastAPI + uvicorn + pydantic v2 (ADR-0026).
  SQLAlchemy 2.0 async + asyncpg (A-128). Raw SQL for pgvector similarity search per A-128's
    carve-out.
  Alembic — schema `search`, plus ADR-0035's RLS policy.
  pgvector — exact cosine-distance scan for <1000 prompts; no approximate index at MVP scale.
  openai Python client — two clients, one for the App Agent and one for embeddings.
  Configurable via APP_OPENAI_API_KEY and EMBEDDING_API_KEY.
  prometheus-client + structlog (ADR-0030, A-046).
  python-ulid — `psi_` and `psj_` identifiers (A-045, ADR-0003).
  Cache: workspace-scoped embedding cache keyed by SHA-256 text hash; index status itself is
    always read from the database.

performance_requirements:
  - metric: quick search latency
    target: p95 < 200 ms
    condition: 1,000 prompts, keyword match on title + purpose + tags
    source: Supports "find in ≤ 30 s" (H-01) with human as bottleneck.
  - metric: AI search latency
    target: p95 < 1,000 ms
    condition: 1,000 indexed prompts, semantic similarity, warm connection pool
    source: Includes embedding generation (if not cached), pgvector query, result merge.
  - metric: index extraction time
    target: p95 < 5,000 ms
    condition: App Agent call for metadata + embedding generation
    source: Async job, user sees progress; not on critical path.
  - metric: index write latency
    target: p95 < 100 ms
    condition: Single row insert, plus nearest-neighbor query
    source: Must not slow down the async job completion.

agent:
  program: |
    `dspy.Predict` over the `MetadataExtraction` signature — three untrusted
    input fields (title, purpose, body) and six typed output fields (keywords,
    topics, entities, variations_en, variations_vi, language). No
    ChainOfThought: a rationale field would spend output tokens narrating a
    classification and would put body content in a second place the telemetry
    layer has to keep clean. `variations` is assembled into the nested
    `ExtractedVariations` shape by code, not returned nested by the model.
  instruction_authority: |
    The Langfuse prompt version labelled `production` (`prope/prompt-search-extraction`),
    fetched with a 300 s cache and a compiled-in fallback. A DSPy artifact loaded
    from PROMPT_SEARCH_DSPY_PROGRAM contributes DEMONSTRATIONS only; its
    instructions are overwritten at build time. Enforced in
    `agent/dspy_program.build_program` and asserted by
    `test_build_program_applies_the_artifact_before_the_instruction`.
  optimization: |
    `python -m prope.prompt_search.agent.optimize` runs offline against
    `agent/datasets/extraction_golden.jsonl`. It writes an artifact and, with
    --publish, an UNLABELLED Langfuse version. It cannot promote. A source-wide
    test asserts the two `bootstrap_prompt.py` files are the only modules
    passing a non-empty `labels` to `create_prompt`.
  determinism_boundary: |
    The agent chooses which words describe a prompt. Prope chooses how many
    there may be (MAX_KEYWORDS / MAX_TOPICS / MAX_ENTITIES / MAX_VARIATIONS in
    `domain.py`), how long a single term may be, that terms are trimmed, folded
    and de-duplicated, that `language` contains only `en` and `vi` in that
    order, and that an extraction with no keywords is refused rather than
    stored. None of it is reachable by a prompt change.
  quality_signal: |
    `agent/evaluation.score_extraction` grades every LIVE extraction on
    completeness (0.45), groundedness (0.35) and hygiene (0.20) and records the
    total to `prompt_search_extraction_quality` and to the Langfuse trace. It is
    arithmetic, not a judge model — deliberately, because a judge would need to
    be shown the body (A-020), would drift underneath the metric, and would
    double the cost of the one feature that spends the app's own money.
  no_repair_attempt: |
    Unlike prompt-conversion there is no retry. `metadata_of` cleans rather than
    rejects, so the only failure left is an empty extraction, and the LM runs at
    temperature 0 — a second identical request returns the same empty answer at
    twice the cost. The job fails, the user retries, and
    `prompt_search_extraction_total{outcome="invalid_output"}` counts it.

boundaries:
  external_processing: |
    Title, purpose and body leave Prope only when a user triggers indexing or
    opens the index preview. Both use the app-owned OpenAI service and the app's
    key; user BYOK credentials are never used. The body is cut at
    PROMPT_SEARCH_BODY_CHAR_LIMIT first, and the truncation is counted.
  telemetry_content: |
    Never sent to Langfuse: the title, the purpose, the body, the rendered
    prompt, the completion, or any extracted keyword, topic, entity or
    variation. Sent: span timings, token counts, estimated cost, character
    counts, the prompt version, the truncation flag, and five deterministic
    scores. DSPy's on-disk completion cache is DISABLED (`cache=False`, in
    `prope.app_agent.dspy_runtime`) so that no prompt body reaches the host
    filesystem, and OpenInference auto-instrumentation is deliberately not
    installed because it captures prompts and completions by default.
  dependency_direction: |
    The agent layer depends on `prope.app_agent` for the shared LM, its circuit
    breaker and the Langfuse client. It does NOT import prompt-conversion; the
    two agents share code through `app_agent`, which is infrastructure both
    already depended on, rather than through a module edge this lock does not
    declare.

observability_requirements:
  metrics:
    - prompt_search_quick_duration_seconds
      # histogram, labels: result_count_bucket
    - prompt_search_ai_duration_seconds
      # histogram, labels: result_count_bucket, cache_hit (embedding cached?)
    - prompt_search_index_triggered_total
      # labels: prompt_id workspace_id
    - prompt_search_index_completed_total
      # labels: workspace_id, with_dup_warning (bool)
    - prompt_search_index_failed_total
      # labels: workspace_id, reason = agent_error | embedding_error | db_error
    - prompt_search_embedding_cache_hits_total
    - prompt_search_embedding_cache_misses_total
    # The extraction agent. Every label below has a CLOSED set of values fixed
    # in source, per ADR-0030.
    - prompt_search_extraction_total
      # labels: outcome = success | invalid_output | unavailable
    - prompt_search_extraction_duration_seconds
      # histogram, no labels
    - prompt_search_extraction_tokens_total
      # labels: direction = input | output
    - prompt_search_extraction_cost_usd_total
    - prompt_search_extraction_prompt_fallback_total
    - prompt_search_extraction_body_truncated_total
    - prompt_search_extraction_quality
      # histogram, no labels, 0.0-1.0
  cardinality_debt: |
    **The three `index_*_total` counters above violate ADR-0030 and this block
    is why.** `prope/observability.py` states the project rule: every label has a
    closed set of values fixed in source, and `workspace_id` — the
    highest-cardinality identifier in the system — is never a label. All three
    carry `workspace_id`, and `index_triggered_total` also carries `prompt_id`,
    which is unbounded: one Prometheus series per prompt ever indexed, retained
    for the life of the series.

    The code matches this lock file; it is this lock file that disagrees with the
    ADR. Recorded rather than silently changed, because the fix removes labels
    that a dashboard or alert may already read. The intended shape is
    `with_dup_warning` and `reason` only, with `workspace_id` and `prompt_id`
    moved to the log line, where LOGGABLE_FIELDS already admits both. Every
    metric added in 0.2.0 already has a closed label set, and
    `test_every_extraction_metric_label_has_a_closed_value_set` stops the debt
    spreading further.
  log_fields:
    - actor_id, workspace_id, prompt_id, version_id, job_id, action, outcome, duration_ms,
      search_type, result_count
    - "Never logged: prompt body, extracted metadata content (keywords may contain sensitive terms)"
  alerts:
    - PromptSearchLatencyHigh — search p95 > 1,000 ms for 5 min
    - PromptSearchIndexFailureRate — index_failed_total rising > 10% over 15 min
    - PromptSearchAgentCircuitOpen — circuit breaker tripped on App Agent calls
    # All severity: ticket. Indexing is on-demand and async and quick search
    # works with no index at all, so none of these is worth a page.
    - PromptSearchExtractionQualityDropped — median quality < 0.7 for 30 min
    - PromptSearchExtractionInvalidRate — > 10% of extractions return no keywords
    - PromptSearchExtractionPromptFallback — the Langfuse `production` label stopped resolving
    - PromptSearchExtractionDailyCostHigh — > $5 of extraction spend in 24 h
    - PromptSearchExtractionTruncationHigh — > 25% of bodies cut before the agent reads them

security_requirements:
  - Every search and index request resolves permission through access-control before touching
    data. No unauthenticated read path.
  - A prompt the actor may not see returns the same empty result as a nonexistent query.
    Existence is not leaked by a 404 on search.
  - Permission filtering lives in the repository layer, not in handlers.
  - App Agent calls use the app's API key only — user's BYOK credentials are never used for
    extraction or embedding.
  - Extracted metadata (keywords, topics, entities) may contain sensitive terms from prompt
    bodies. It is stored but never logged. It is returned in AI search results to the actor
    who could already read the prompt.
  - >-
    nearest_neighbor data is computed at index time only — not recomputed on every search.
    This is intentional: the similarity between prompts does not change based on who searches.
  - >-
    STRIDE review completed: spoofing is contained by required sessions; tampering and tenant
    crossover by validated queue envelopes, bound parameters, RLS, and permission-filtered
    registry reads; repudiation by actor/job logs; information disclosure by not-found permission
    behavior and never logging bodies/metadata; denial of service by bounded query limits, a 5 s
    statement timeout, upstream timeout/retries, and circuit breaker; elevation of privilege by
    re-checking prompt read/write permission at every HTTP boundary.

failure_modes:
  - scenario: App Agent is unavailable or returns an error during extraction.
    detection: prompt_search_index_failed_total{reason=agent_error} rises; job status = failed.
    impact: Indexing job fails; the prompt remains unindexed. User sees an error and can retry.
    mitigation: Async job with explicit status. User can retry. Job retains error message for
      debugging. Circuit breaker prevents cascading failures if the API is degraded.
  - scenario: Embedding service is unavailable.
    detection: prompt_search_index_failed_total{reason=embedding_error} rises.
    impact: Indexing job fails. Semantic search cannot function without embeddings.
    mitigation: Same as above — async job with retry. Quick search still works for unindexed
      prompts.
  - scenario: pgvector query returns no results or times out.
    detection: prompt_search_ai_duration_seconds spikes; error logged.
    impact: AI search returns an error; user falls back to quick search.
    mitigation: Timeout on pgvector query (5 s). Graceful degradation — AI search error is
      surfaced to user, not silent empty results.
  - scenario: A prompt is edited after indexing; the index is now stale.
    detection: GET /prompts/{id}/index shows version_id mismatch with latest approved revision.
    impact: Search may return outdated metadata. The "This version is not indexed" prompt appears.
    mitigation: Not auto-reindexed by design (on-demand). User must re-index after significant
      edits. This is intentional — avoids indexing drafts.
  - scenario: Near-duplicate prompts both get indexed with >90% similarity.
    detection: nearest_neighbor_similarity > 0.9 on index preview.
    impact: Warning shown at index time only. User sees it once and can act. Search does not
      suppress either result.
    mitigation: Warning at index time is the UX choice (not blocking). User sees both prompts
      and decides. Future clustering work could surface this in the prompt list.

acceptance_criteria:
  - id: AC-1
    text: Given a workspace with 500 prompts (100 indexed, 400 not), when user searches with
      type=quick, then all 100 prompts matching the keyword are returned, regardless of index
      status, permission-filtered to only what the actor may see.
    test_ref: tests/integration/test_prompt_search.py::test_quick_search_all_prompts
  - id: AC-2
    text: Given a workspace with 100 indexed prompts, when user searches with type=ai for
      "customer refund request", then results are ordered by cosine similarity descending and
      each result includes a similarity score.
    test_ref: tests/integration/test_prompt_search.py::test_ai_search_semantic
  - id: AC-3
    text: Given an approved prompt that has not been indexed, when the owner clicks "Index
      this prompt", then the App Agent extracts metadata, generates an embedding, computes
      nearest neighbors, and stores the index record — all async.
    test_ref: tests/integration/test_prompt_search.py::test_on_demand_indexing
  - id: AC-4
    text: Given a prompt whose nearest neighbor has >90% similarity, when the index preview
      is shown, then a duplicate warning appears naming the similar prompt and its similarity.
    test_ref: tests/integration/test_prompt_search.py::test_duplicate_warning
  - id: AC-5
    text: Given a private prompt owned by A, when B (no grant) searches, then it does not
      appear in results, regardless of search type.
    test_ref: tests/integration/test_prompt_search.py::test_search_respects_permissions
  - id: AC-6
    text: Given an indexed prompt with a new approved revision, when someone views the prompt
      detail, then the "This version is not indexed" message appears and "Index this prompt"
      offers to index the new version.
    test_ref: tests/integration/test_prompt_search.py::test_stale_index_detection

ranking:
  shape: |
    Two legs over the same visible set, fused by `prompt_search.ranking`:

      vector   pgvector cosine against prompt_search_index. Gated at 0.25.
      lexical  the query's distinctive terms probed against the registry's
               trigram document AND the extracted keyword/topic arrays,
               scored by the share of the query's IDF mass a prompt accounts for.

    The vector ordering leads; lexical evidence adjusts it within a bounded band
    (LEXICAL_BONUS, 0.08 of cosine); prompts only the lexical leg found follow in
    a second tier. That tier ordering is what keeps "the index is an accelerator,
    not a gate" from becoming "an unindexed prompt can displace an indexed one".
  why_not_rrf: |
    `docs/materials/2-rag-pipeline.pdf` p20 recommends Reciprocal Rank Fusion and
    it is implemented (`PROMPT_SEARCH_RANKER=rrf`) — and it measured WORSE than
    what it replaced: MRR 0.83 against 0.89, recall@3 on cluster queries 0.43
    against 0.78. RRF rewards agreement between legs, which is right when the legs
    are comparably good. Here they are not: the vector leg alone answers 86% of
    queries at rank 1, and agreement-boosting let a prompt it ranked fifth overtake
    the one it ranked first for sharing two ordinary words. The deck's advice is
    sound and the corpus is the exception; both facts are recorded rather than one
    of them being followed.
  admission: |
    Three rules keep the lexical leg from answering questions the corpus cannot,
    each added because the previous one measured insufficient:
      - a term matching more than 25% of visible prompts is dropped — it cannot
        separate two documents whatever weight it carries;
      - a candidate must match at least TWO surviving terms (a one-term query is
        exempt: `SQL`, `GDPR`, an error code);
      - and at least one of them must be SPECIFIC — under 5% of the corpus and at
        least four characters. Substring matching over diacritic-folded text
        manufactures rare-looking fragments: `phở` folds to `pho`, which is inside
        *phone*.
    Without them, out-of-scope queries retrieved ten prompts each and abstention
    on the adversarial set fell from 100% to 20%. With them it is 100% again.
  small_workspaces: |
    Every rule above reads a SHARE of the corpus, and a share needs a corpus.
    Below 20 visible prompts (PROMPT_SEARCH_MIN_CORPUS_FOR_DF) the frequency
    rules are suspended rather than scaled, because they do not become strict at
    that size — they become unsatisfiable:
      - with four prompts, a term matching two is in 50% of them and the 25% cap
        deletes it. Searching `sql` in a library of four returned NOTHING;
      - the 5% anchor threshold cannot be met at all until the workspace holds
        twenty prompts, so every multi-word duplicate check would refuse;
      - and IDF itself is degenerate: log((N+1)/(df+1)) is exactly zero when a
        term is in every prompt, so in a one-prompt workspace the whole query
        weighed zero and search found no match for a phrase printed in the only
        prompt there was. Uniform weights are the fallback.
    The length half of the anchor rule stays on — a three-character fragment is
    an accident of substring matching at any corpus size.

    This class of defect is structurally invisible to the 200-prompt evaluation
    in `eval/`, and every instance was caught by an integration test over four
    seeded rows. Both suites are load-bearing, and a new workspace is every
    workspace on its first day. Measured: the guards leave all twelve metrics of
    the 200-prompt run byte-identical (`eval/result/*-smallcorpus-guards.json`
    against `*-H-final.json`).
  asymmetry: |
    The anchor rule is enforced on the AI path and NOT on the keyword path. The
    duplicate check speaks in the product's voice — a row there asserts *this may
    already exist* — while a keyword box asserts nothing and the person is reading
    the titles. Requiring an anchor on both cost the keyword path a fifth of its
    recall, because a conceptual question contains no rare word to anchor on.

test_plan:
  unit: |
    Metadata extraction prompt and parsing; embedding caching (dedup by text hash);
    nearest-neighbor SQL query; permission filter SQL injection (negative tests);
    GIN index behavior for keywords/topics overlap.
    Fusion, IDF weighting and the three admission rules —
    tests/unit/test_prompt_search_ranking.py, with no database. Ranking is the part
    most likely to regress and the part an integration test is worst at catching,
    because a worse ordering is still an ordering.
  retrieval_quality: |
    `eval/retrieval/` — 42 labelled queries over a 200-prompt corpus drawn from
    `playgrounds/prompts`, run against the real search path with real extraction
    and embedding calls. Reports context recall/precision, MRR, nDCG, abstention
    on adversarial queries, and latency; optionally grades the top 3 with an
    LLM judge (rubric 1-5). Scorecards in `eval/result/`, method in `eval/README.md`.
    This is the only suite that can fail when ranking gets worse.
  integration: Indexing flow end-to-end (trigger -> job -> store); quick search vs AI search
    behavior on same query; permission filtering across search types; stale index detection.
  contract: Search API contract (request/response shapes, error codes). Indexing job lifecycle.
    Permission seam with access-control.
  e2e: Register prompt -> approve -> index -> search -> find it -> edit body -> re-approve ->
    search finds stale metadata -> re-index -> search finds updated result.
  load: 1,000 prompts, 500 indexed; quick search p95 < 200 ms; AI search p95 < 1,000 ms.
  security: Permission leak tests (private prompt not in results); metadata not logged; App Agent
    uses app key only (verify no user credentials in request).
  chaos: App Agent API returns 500 — job fails and user can retry; embedding API times out —
    graceful degradation to error message.

risks:
  - risk: App Agent API costs accumulate if indexing is overused (user indexes every draft).
    mitigation: >-
      On-demand design reduces this. prompt_search_extraction_cost_usd_total now
      reports the spend directly and PromptSearchExtractionDailyCostHigh alerts on
      it. Future: rate limit per workspace.
  - risk: >-
      Embedding model mismatch — if App embedding model changes, existing embeddings are
      stale.
    mitigation: Version tracking on embeddings (model_id stored). Re-indexing required on model
      change. Alert on model version mismatch.
  - risk: <1000 prompts assumption is conservative; growth may require index type change.
    mitigation: Flat index is fine for <1000. IVFFlat or HNSW migration path documented.
      No premature optimization.

open_questions:
  - id: OQ-S001
    question: Should re-indexing happen automatically when a prompt is re-approved?
    blocks_build: false
    note: >-
      Current design: no. User must click "Index this prompt" again. Re-consider if UX
      feedback shows friction.
  - id: OQ-S002
    question: Should AI search include keyword-boosted scoring (hybrid search)?
    blocks_build: false
    note: >-
      Current design: yes, keyword match signals boost semantic score. RRF or simple
      weighted sum. Can tune after MVP with real queries.

assumptions:
  - {id: A-S001, text: "The PostgreSQL deployment uses the pgvector image and migration 0012 enables the extension", decided_by: agent}
  - {id: A-S002, text: "App Agent uses gpt-4o-mini (fast, cheap) for metadata extraction; configurable via APP_AGENT_MODEL", decided_by: agent}
  - {id: A-S003, text: "Embedding model is text-embedding-3-small (OpenAI); cached by text hash to avoid re-embedding identical texts", decided_by: agent}
  - {id: A-S004, text: "On-demand indexing: user action required; no auto-indexing on save", decided_by: user}
  - {id: A-S005, text: "App Agent is SEPARATE from user's BYOK provider; app owns the key, bears the cost", decided_by: user}
  - {id: A-S006, text: "Only approved prompts are eligible for indexing", decided_by: user}
  - {id: A-S007, text: "Clustering / auto-grouping is future work; metadata extraction enables it later", decided_by: user}
  - {id: A-S008, text: "Scale: <1000 prompts in MVP; pgvector flat index is sufficient", decided_by: user}
  - {id: A-S150, text: "Diacritic folding for keyword search: reuse prompt-registry's search_text trigger logic (A-150, ADR-0048)", decided_by: agent}
  - {id: A-S151, text: "Search is scoped to workspace; cross-workspace search not supported", decided_by: agent}
  - {id: A-S152, text: "Pagination: cursor-based for consistency with prompt-registry (A-045)", decided_by: agent}
  - {id: A-S153, text: "Duplicate threshold: 90% similarity; configurable via SEARCH_DUPLICATE_THRESHOLD env var", decided_by: agent}
  - {id: A-S154, text: "Global interface conventions: ULID ids with typed prefixes, one error envelope, cursor pagination, /healthz and /readyz", decided_by: agent, from_oq: OQ-S003}
  - {id: A-S155, text: "Global observability conventions: structured JSON logs, prompt_search_<name>_<unit> metrics, prompt bodies and credentials never logged", decided_by: agent}
  - {id: A-S156, text: "All timestamps are RFC 3339 UTC", decided_by: agent}
  - {id: A-S157, text: "Async job tracking: job_id, status, started_at, completed_at, error, result_json", decided_by: agent}

