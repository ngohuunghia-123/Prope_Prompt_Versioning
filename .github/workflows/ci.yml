# CI checks every pull request. A successful push to `main` deploys the checked
# revision by connecting to EC2, fast-forwarding its checkout, and rebuilding the
# Docker Compose services in place.
#
# What replaced the inherited workflow, and why each one is not a style preference:
#
# - **Python 3.13, not 3.11** (ADR-0026). `pyproject.toml` declares
#   `requires-python = ">=3.13,<3.14"`, so 3.11 could not install the project at all.
# - **`uv sync --frozen`, not `pip install -r requirements.txt`.** There is no
#   `requirements.txt` in this repository; there is a `uv.lock`, and `--frozen` is
#   what makes CI resolve the dependency set that was reviewed rather than a fresh
#   one.
# - **No `services:` block, and its absence is a decision.** `tests/conftest.py`
#   opens PostgreSQL 17 and RabbitMQ 4.3 through **testcontainers**, and its module
#   docstring rejects the service-container/local-compose split by name: *"two
#   provisioning paths drift, and the first drift reads as green CI over a broken
#   local run."* Docker is present on `ubuntu-latest`, so the same rig runs in both
#   places. Adding `services:` here would create the second path the rig refused.
# - **No `mypy` step.** The `Makefile` says it out loud — mypy is deliberately absent
#   from the dependency set, *"and a target that calls a tool nobody installed is a
#   broken target left standing for 24 phases."* ADR-0031 named it before that was
#   settled; `ruff` and the architecture suite are what gate.
# - **No `OPENAI_API_KEY`.** The openai SDK is a test-only oracle that parses
#   responses; nothing in the suite calls an upstream provider, and a key in a
#   workflow file is a key.
#
# The suite is what turns step 3's promises into build failures: ADR-0025's withheld
# `UPDATE`/`DELETE` on `history.history_event`, A-123's empty route table, BR-03's
# constraint, A-124's allow-list, ADR-0045's tenant-coverage walk, ADR-0008's
# layering contract. They are database and route-table behaviours, so they only mean
# anything against the real engines above.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time, and never a cancelled one. `cancel-in-progress` is FALSE on
# purpose: cancelling a run mid-deploy leaves the VM with images pulled, migrations
# possibly applied, and services half-recreated — the one state nobody can reason
# about. Queued runs simply wait.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, test, and build the SPA
    runs-on: [self-hosted, Linux, X64, cohort3]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # --- Python (ADR-0026) ------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Same version the app image installs, so a resolver difference between
          # the pipeline and the artefact is not a thing that can happen.
          version: "0.9.7"
          enable-cache: true

      - name: Install the dependency set from the lock file
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ alembic/

      # --- Frontend (ADR-0052) ---------------------------------------------

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/prope-fe/pnpm-lock.yaml

      - name: Install the frontend dependency set from the lock file
        working-directory: src/prope-fe
        run: pnpm install --frozen-lockfile

      - name: Lint the SPA
        working-directory: src/prope-fe
        run: pnpm lint

      # `pnpm build` is `tsc -b` then vite. It runs here as well as inside
      # `Dockerfile.web` because a pull request never reaches the image build, and a
      # type error on the API's first-party client should fail the PR rather than
      # the deploy.
      - name: Build the SPA
        working-directory: src/prope-fe
        run: pnpm build

      # ADR-0031's amendment puts this in the same job as the Python checks: the
      # dependency-vulnerability surface ADR-0034 declined arrives with the
      # ecosystem that was asked for. `--audit-level high` so a moderate advisory in
      # a build-time devDependency does not block a security fix to the API; raise
      # it to `moderate` when the pilot ends.
      - name: Audit frontend dependencies
        working-directory: src/prope-fe
        run: pnpm audit --audit-level high

  deploy:
    name: Deploy to EC2
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, cohort3]
    timeout-minutes: 20
    steps:
      - name: Pull and rebuild on EC2
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          # Pinned host key rather than `StrictHostKeyChecking=no`. Accepting any
          # key on first contact means a machine-in-the-middle gets one free
          # chance at the deploy channel, on every runner, forever — and a runner
          # is a fresh machine every time, so "first contact" is every time.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              ubuntu@50.19.128.139 \
              'cd /home/ubuntu/P-113 && git pull --ff-only origin main && docker compose up -d --build'
