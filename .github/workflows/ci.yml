# CI checks every pull request. A successful push to `main` deploys the checked
# revision by connecting to EC2, fast-forwarding its checkout, and rebuilding the
# Docker Compose services in place.
#
# What replaced the inherited workflow, and why each one is not a style preference:
#
# - **Python 3.13, not 3.11** (ADR-0026). `pyproject.toml` declares
#   `requires-python = ">=3.13,<3.14"`, so 3.11 could not install the project at all.
# - **`uv sync --frozen`, not `pip install -r requirements.txt`.** There is no
#   `requirements.txt` in this repository; there is a `uv.lock`, and `--frozen` is
#   what makes CI resolve the dependency set that was reviewed rather than a fresh
#   one.
# - **No test job, and its absence is policy, not an omission.** The repository
#   keeps no committed test suite (see AGENTS.md, "Testing"): tests are written
#   and run inside a single working session and deleted once they pass, so there
#   is nothing CI could run. The gate here is `ruff` plus the SPA type-check and
#   build.
# - **No `services:` block, and its absence is a decision.** A database or broker
#   would only exist to serve tests, and with no suite there is nothing to
#   provision. Adding services back means deciding, in the same change, which
#   session-scoped suite needs them and where it lives.
# - **No `mypy` step.** The `Makefile` says it out loud — mypy is deliberately absent
#   from the dependency set, *"and a target that calls a tool nobody installed is a
#   broken target left standing for 24 phases."* ADR-0031 named it before that was
#   settled; `ruff` is what gates.
# - **No `OPENAI_API_KEY`.** A key in a workflow file is a key.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time, and never a cancelled one. `cancel-in-progress` is FALSE on
# purpose: cancelling a run mid-deploy leaves the VM with images pulled, migrations
# possibly applied, and services half-recreated — the one state nobody can reason
# about. Queued runs simply wait.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint and build the SPA
    runs-on: [self-hosted, Linux, X64, cohort3]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # --- Python (ADR-0026) ------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Same version the app image installs, so a resolver difference between
          # the pipeline and the artefact is not a thing that can happen.
          version: "0.9.7"
          enable-cache: true

      - name: Install dependencies and lint
        run: |
          uv sync --frozen
          uv run ruff check src/ alembic/

      # --- Frontend (ADR-0052) ---------------------------------------------

      # Node must exist before pnpm: on a self-hosted runner there is no
      # preinstalled runtime, and `@pnpm/exe`'s preinstall runs `node setup.js`.
      # Hosted runners hide this by shipping Node in the image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `standalone` bypasses npm's self-installer, so a stray `prefix=` in any
      # `.npmrc` on the runner cannot point the install at an unwritable path.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          standalone: true

      # A second setup-node call attaches the pnpm cache, which needs pnpm on
      # PATH and therefore cannot ride on the first call.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/prope-fe/pnpm-lock.yaml

      - name: Install the frontend dependency set from the lock file
        working-directory: src/prope-fe
        run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc -b` then vite. It runs here as well as inside
      # `Dockerfile.web` because a pull request never reaches the image build, and a
      # type error on the API's first-party client should fail the PR rather than
      # the deploy. The audit (`--audit-level high`) is ADR-0031's amendment; raise
      # it to `moderate` when the pilot ends.
      - name: Lint, build, and audit the SPA
        working-directory: src/prope-fe
        run: |
          pnpm lint
          pnpm build
          pnpm audit --audit-level high

  deploy:
    name: Deploy to EC2
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, cohort3]
    timeout-minutes: 20
    steps:
      - name: Pull and rebuild on EC2
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          # Pinned host key rather than `StrictHostKeyChecking=no`. Accepting any
          # key on first contact means a machine-in-the-middle gets one free
          # chance at the deploy channel, on every runner, forever — and a runner
          # is a fresh machine every time, so "first contact" is every time.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              ubuntu@13.212.142.141 \
              'cd ~/P-113 && git pull --ff-only origin main && docker compose up -d --build'
