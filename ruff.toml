target-version = "py313"
line-length = 120

# Operational and diagnostic scripts remain outside the application lint scope.
# The standing backend gate is defined explicitly by `make lint`.
exclude = ["scripts"]

[lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
