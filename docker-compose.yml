# ADR-0033: 7 services, 2 images, one group-controlled Linux VM (or, here, one
# laptop — ADR-0033's own stated dev/demo target).
#
# `caddy` is now ADR-0052's two-stage SPA build rather than the stock image. The
# frontend source arrived at `src/prope-fe` (ADR-0052's sketch says `web/`; the
# shape is the same and the path is not), so `Dockerfile.web` has something to
# build: Node in the build stage, `caddy:2` with the assets in `/srv` at runtime.
#
# Bootstraps in two steps because the first `alembic upgrade head` needs a
# Postgres superuser (revision 0001's `CREATE ROLE ... BYPASSRLS`) while
# `app`/`worker` must run as `prope_app` — see the `migrate` service and
# `alembic/bootstrap_roles.py`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prope"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # `rabbitmq-diagnostics` boots an Erlang VM per probe, so a probe costs
    # seconds where `pg_isready` costs milliseconds. At `timeout: 5s` on a
    # laptop that is also finishing two image builds the probe misses its
    # deadline, the failing streak reaches `retries`, and docker flips a broker
    # that never stopped serving to `unhealthy` — which aborts every dependant
    # waiting on `service_healthy` with "dependency rabbitmq failed to start".
    # The broker was healthy throughout; only the probe was starved. Hence a
    # deadline the probe can actually meet under load, and a `start_period` for
    # the boot itself, which is the slowest probe of all.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      start_period: 60s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  # One-shot: alembic upgrade head as the postgres superuser, then set the
  # three role passwords app/worker connect with. `restart: "no"` — a
  # migration that keeps restarting is a migration that keeps re-running.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: prope-app:local
    command: sh -c "alembic upgrade head && python alembic/bootstrap_roles.py"
    environment:
      PROPE_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/prope
      PROPE_MIGRATE_PASSWORD: ${PROPE_MIGRATE_PASSWORD}
      PROPE_APP_PASSWORD: ${PROPE_APP_PASSWORD}
      PROPE_REPORT_PASSWORD: ${PROPE_REPORT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prope-app:local
    command: uvicorn prope.app:app --host 0.0.0.0 --port 8000
    environment:
      PROPE_DATABASE_URL: postgresql+asyncpg://prope_app:${PROPE_APP_PASSWORD}@postgres:5432/prope
      PROPE_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      # **The one place `Secure` comes off the session cookie, and it is here
      # because this file IS the laptop target.** ADR-0033 says a laptop is the
      # development and demo target only; Caddy listens on `:80` with no domain and
      # therefore no certificate, and a browser **silently discards** a `Secure`
      # cookie sent over plain HTTP. The failure that produces is the worst-behaved
      # one available: sign-in answers 200, the SPA routes to the workspace, and
      # every request after it is a 401 with nothing in any log saying why.
      #
      # `PROPE_COOKIE_SECURE` defaults to **true** and a test asserts the default,
      # so a real deployment that never sets this key gets the ADR-0043 cookie. A
      # host serving HTTPS should DELETE this line rather than set it to `true` —
      # the absence is the safe state.
      PROPE_COOKIE_SECURE: "false"
      APP_ENV: ${APP_ENV:-development}
      ADMIN_SESSION_TOKEN: ${ADMIN_SESSION_TOKEN:-}
      # ADR-0014 / A-135. Without it `/readyz` answers 503 naming `kek` and no
      # provider credential can be encrypted or decrypted — which is the correct
      # behaviour and also, on a fresh clone, a confusing one, so: put
      # `PROPE_KEK_V1=<32 bytes, base64>` in `.env`. `load_keks()` skips an empty
      # value, so an unset variable stays a clean 503 rather than an empty key.
      PROPE_KEK_V1: ${PROPE_KEK_V1}
      APP_OPENAI_BASE_URL: ${APP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      APP_AGENT_MODEL: ${APP_AGENT_MODEL:-gpt-4o-mini}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-3-small}
      # Embeddings are a separate product from chat, and an OpenAI-compatible
      # gateway is under no obligation to serve both: several front a dozen chat
      # models and answer 404 on `/embeddings`, which turns every semantic search
      # into a 503 no amount of retrying fixes. These three point the embedding
      # client somewhere else. Each falls back to its `APP_OPENAI_*` /
      # `APP_EMBEDDING_MODEL` counterpart when EMPTY, so a deployment using one
      # provider for everything sets none of them and behaves exactly as before.
      #
      # `EMBEDDING_MODEL` is written into every index row and every cache key, and
      # an index whose stored model is not the current one reads as STALE — so
      # changing it re-indexes the workspace rather than silently mixing vector
      # spaces that were never comparable.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Both vector columns are `vector(1536)`, so a model of any other width
      # does not store — it raises on the insert, after the call has been paid
      # for. Asked of the provider rather than sliced here: for a Matryoshka
      # model (Qwen3-Embedding is one) a 1536-wide answer is a shorter embedding,
      # not a truncated array. Set it EMPTY to omit the parameter entirely, which
      # legacy `text-embedding-ada-002` requires.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS-1536}
      # One attempt, not the whole call: the client retries three times on top.
      # Higher than the agent's 5s because a large open-weights embedding model on
      # a shared host answers in ~10s cold, and a timeout shorter than the provider
      # burns an attempt on every single request before the retry succeeds.
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      SEARCH_DUPLICATE_THRESHOLD: ${SEARCH_DUPLICATE_THRESHOLD:-0.9}
      # prompt-conversion's LLM budget and its cost arithmetic. On `app` only:
      # conversion is a request-path feature and `worker` never calls it. The
      # two prices are per MILLION tokens and must be changed together with
      # APP_AGENT_MODEL, or `prope_prompt_conversion_cost_usd_total` reports the
      # old model's bill for the new model's traffic.
      APP_AGENT_MAX_OUTPUT_TOKENS: ${APP_AGENT_MAX_OUTPUT_TOKENS:-12000}
      APP_AGENT_PRICE_INPUT_PER_MTOK: ${APP_AGENT_PRICE_INPUT_PER_MTOK:-0.15}
      APP_AGENT_PRICE_OUTPUT_PER_MTOK: ${APP_AGENT_PRICE_OUTPUT_PER_MTOK:-0.60}
      # Unset means the zero-shot conversion program. A compiled DSPy artifact
      # is opt-in by path, and even then only its demonstrations load — the
      # instruction always comes from the Langfuse `production` label.
      PROMPT_CONVERSION_DSPY_PROGRAM: ${PROMPT_CONVERSION_DSPY_PROGRAM:-}
      # prompt-search's extraction agent. On `app` for the preview route only;
      # the indexing job that uses the same agent runs in `worker`, which
      # carries the same three settings.
      PROMPT_SEARCH_MAX_OUTPUT_TOKENS: ${PROMPT_SEARCH_MAX_OUTPUT_TOKENS:-2000}
      PROMPT_SEARCH_BODY_CHAR_LIMIT: ${PROMPT_SEARCH_BODY_CHAR_LIMIT:-4000}
      PROMPT_SEARCH_DSPY_PROGRAM: ${PROMPT_SEARCH_DSPY_PROGRAM:-}
      # ADR-0030's fourth pillar. All three unset is a SUPPORTED configuration:
      # `get_langfuse()` returns None, every span becomes a nullcontext, and
      # conversion runs on Prometheus metrics and JSON logs alone. What is lost
      # is the span tree and the managed instruction — the module then serves
      # `FALLBACK_SYSTEM_PROMPT` and says so through
      # `prope_prompt_conversion_prompt_fallback_total`.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  # No published port and no healthcheck: D-17 forbids worker an HTTP
  # surface, and its own module docstring says its compose healthcheck is
  # process-level — this is that.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: prope-app:local
    command: python -m prope.worker
    environment:
      PROPE_DATABASE_URL: postgresql+asyncpg://prope_app:${PROPE_APP_PASSWORD}@postgres:5432/prope
      PROPE_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      # provider-access's batch dispatch runs in this process (ADR-0049), so it
      # decrypts too. No cookie setting here — D-17 forbids worker an HTTP surface.
      PROPE_KEK_V1: ${PROPE_KEK_V1}
      APP_OPENAI_BASE_URL: ${APP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      APP_AGENT_MODEL: ${APP_AGENT_MODEL:-gpt-4o-mini}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-3-small}
      # Embeddings are a separate product from chat, and an OpenAI-compatible
      # gateway is under no obligation to serve both: several front a dozen chat
      # models and answer 404 on `/embeddings`, which turns every semantic search
      # into a 503 no amount of retrying fixes. These three point the embedding
      # client somewhere else. Each falls back to its `APP_OPENAI_*` /
      # `APP_EMBEDDING_MODEL` counterpart when EMPTY, so a deployment using one
      # provider for everything sets none of them and behaves exactly as before.
      #
      # `EMBEDDING_MODEL` is written into every index row and every cache key, and
      # an index whose stored model is not the current one reads as STALE — so
      # changing it re-indexes the workspace rather than silently mixing vector
      # spaces that were never comparable.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Both vector columns are `vector(1536)`, so a model of any other width
      # does not store — it raises on the insert, after the call has been paid
      # for. Asked of the provider rather than sliced here: for a Matryoshka
      # model (Qwen3-Embedding is one) a 1536-wide answer is a shorter embedding,
      # not a truncated array. Set it EMPTY to omit the parameter entirely, which
      # legacy `text-embedding-ada-002` requires.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS-1536}
      # One attempt, not the whole call: the client retries three times on top.
      # Higher than the agent's 5s because a large open-weights embedding model on
      # a shared host answers in ~10s cold, and a timeout shorter than the provider
      # burns an attempt on every single request before the retry succeeds.
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      SEARCH_DUPLICATE_THRESHOLD: ${SEARCH_DUPLICATE_THRESHOLD:-0.9}
      # **prompt-search's extraction agent runs HERE, not in `app`.** The
      # indexing job is the whole reason this process consumes a queue, so the
      # agent's model budget, its cost arithmetic and its trace backend all have
      # to be present in `worker` as well. They were on `app` only, which is why
      # a preview produced a Langfuse trace and an actual index run produced
      # none — the same call, one of them observable.
      #
      # The two prices are per MILLION tokens and must move together with
      # APP_AGENT_MODEL, or prope_prompt_search_extraction_cost_usd_total
      # reports the old model's bill for the new model's traffic.
      APP_AGENT_PRICE_INPUT_PER_MTOK: ${APP_AGENT_PRICE_INPUT_PER_MTOK:-0.15}
      APP_AGENT_PRICE_OUTPUT_PER_MTOK: ${APP_AGENT_PRICE_OUTPUT_PER_MTOK:-0.60}
      PROMPT_SEARCH_MAX_OUTPUT_TOKENS: ${PROMPT_SEARCH_MAX_OUTPUT_TOKENS:-2000}
      PROMPT_SEARCH_BODY_CHAR_LIMIT: ${PROMPT_SEARCH_BODY_CHAR_LIMIT:-4000}
      # Unset means the zero-shot program, which is the correct default: a
      # compiled artifact is an unreviewed change to how every prompt is indexed
      # unless an operator points at a reviewed file on purpose.
      PROMPT_SEARCH_DSPY_PROGRAM: ${PROMPT_SEARCH_DSPY_PROGRAM:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # Published straight to the host, same as rabbitmq's management UI would be
  # if this laptop target wanted it — these are operator surfaces, not
  # something Caddy's single ingress needs to gate on a dev machine.
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # ADR-0052: image 2 of 2. A BUILT image rather than a stock one — `caddy:2` with
  # the SPA baked into `/srv`, so the UI and the API version together and a
  # rollback of `prope-app` does not leave the previous deploy's JavaScript calling
  # the current API (ADR-0031: "the tested artefact is the deployed one").
  #
  # Still ONE service. Node runs in `Dockerfile.web`'s build stage and nowhere
  # else, so ADR-0033's service count is unchanged at seven.
  #
  # The Caddyfile is COPIED IN by the image rather than bind-mounted: mounting it
  # would let the host's copy drift from the assets it routes to, which is the
  # independent-versioning failure the baked assets exist to prevent, arriving
  # through the config instead of through the bytes.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: prope-web:local
    environment:
      # Parity with `deploy/docker-compose.prod.yml`, so the gateway-only address
      # can be exercised before it matters on the VM. On the laptop it is a plain
      # port rather than a hostname, and 8081 IS published here — unlike in
      # production, where the block rides on 443 under `api.<domain>` and no
      # extra port is opened.
      PROPE_API_ADDRESS: ${PROPE_API_ADDRESS:-:8081}
    ports:
      - "8080:80"
      - "8081:8081"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
