# ADR-0031's deployment half: **the host pulls a published image and never builds.**
#
# This is the file that lives on the VM. It is the repository's `docker-compose.yml`
# with every `build:` removed and replaced by a GHCR reference pinned to a commit
# SHA — which is the whole difference between the two files, and the reason there
# are two. A build stanza on the VM would put a compiler and the full
# dependency-resolution surface beside the workspace provider credentials and the
# stored request bodies, which ADR-0031 rejected by name.
#
# **Two variables drive it, both from `.env` beside this file:**
#
#   PROPE_IMAGE_PREFIX  ghcr.io/<owner>/<repo>  — written once, by hand
#   PROPE_IMAGE_TAG     the commit SHA          — rewritten by deploy.sh on every deploy
#
# A rollback is therefore `PROPE_IMAGE_TAG=<older sha> docker compose up -d`: the
# images are tagged by commit and retained in GHCR, so nothing has to be rebuilt to
# go back. **Migrations are the asymmetric half** — a rollback across a migration is
# a forward migration, not a tag change (ADR-0031).
#
# `.env` also holds the KEK and the four passwords. It is hand-placed, `0600`, and
# never enters CI (ADR-0032), which is why this file names variables and no values.
#
# Run it as:  docker compose -f docker-compose.prod.yml up -d
# (or symlink it to docker-compose.yml on the host — deploy.sh passes -f explicitly.)

# Named explicitly, because compose otherwise derives the project name from the
# DIRECTORY the file sits in — which here is `deploy`, so every container, network
# and volume on the VM would be called `deploy-*`. The name is what `docker compose
# ls`, `docker ps` and every volume are keyed on, so it is not cosmetic: changing it
# later orphans the data volumes under the old name.
name: prope

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prope"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  # One-shot, and ADR-0031 requires it to be **its own deploy step** rather than a
  # side effect of starting `app`: revision 0001 issues `CREATE ROLE ... BYPASSRLS`
  # and so connects as the Postgres superuser, while `app` and `worker` must connect
  # as `prope_app`. `restart: "no"` — a migration that keeps restarting is a
  # migration that keeps re-running.
  migrate:
    image: ${PROPE_IMAGE_PREFIX}/prope-app:${PROPE_IMAGE_TAG}
    command: sh -c "alembic upgrade head && python alembic/bootstrap_roles.py"
    environment:
      PROPE_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/prope
      PROPE_MIGRATE_PASSWORD: ${PROPE_MIGRATE_PASSWORD}
      PROPE_APP_PASSWORD: ${PROPE_APP_PASSWORD}
      PROPE_REPORT_PASSWORD: ${PROPE_REPORT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    logging: *default-logging

  app:
    image: ${PROPE_IMAGE_PREFIX}/prope-app:${PROPE_IMAGE_TAG}
    command: uvicorn prope.app:app --host 0.0.0.0 --port 8000
    environment:
      PROPE_DATABASE_URL: postgresql+asyncpg://prope_app:${PROPE_APP_PASSWORD}@postgres:5432/prope
      PROPE_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      # ADR-0014 / ADR-0032: the key-encryption key, from the hand-placed `.env` and
      # from nowhere else. It exists in exactly one place on earth outside a backup.
      #
      # A-135 selects by VERSION — `load_keks()` scans the environment for
      # `PROPE_KEK_V<n>` and encrypts under the highest it finds, while decryption
      # uses the version the row names. So **rotation is: add `PROPE_KEK_V2` to
      # `.env`, add the line here, redeploy** — and V1 stays until the last row
      # naming it has been re-wrapped. Listing them one per line rather than
      # `env_file:`-ing the whole file is what makes that visible in review.
      #
      # An unset variable arrives as the empty string, which `load_keks()` skips, so
      # a missing KEK is a 503 from `/readyz` naming `kek` — not a silent empty key.
      PROPE_KEK_V1: ${PROPE_KEK_V1}
      APP_OPENAI_BASE_URL: ${APP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      APP_AGENT_MODEL: ${APP_AGENT_MODEL:-gpt-4o-mini}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-3-small}
      # Embeddings are a separate product from chat, and an OpenAI-compatible
      # gateway is under no obligation to serve both: several front a dozen chat
      # models and answer 404 on `/embeddings`, which turns every semantic search
      # into a 503 no amount of retrying fixes. These three point the embedding
      # client somewhere else. Each falls back to its `APP_OPENAI_*` /
      # `APP_EMBEDDING_MODEL` counterpart when EMPTY, so a deployment using one
      # provider for everything sets none of them and behaves exactly as before.
      #
      # `EMBEDDING_MODEL` is written into every index row and every cache key, and
      # an index whose stored model is not the current one reads as STALE — so
      # changing it re-indexes the workspace rather than silently mixing vector
      # spaces that were never comparable.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Both vector columns are `vector(1536)`, so a model of any other width
      # does not store — it raises on the insert, after the call has been paid
      # for. Asked of the provider rather than sliced here: for a Matryoshka
      # model (Qwen3-Embedding is one) a 1536-wide answer is a shorter embedding,
      # not a truncated array. Set it EMPTY to omit the parameter entirely, which
      # legacy `text-embedding-ada-002` requires.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS-1536}
      # One attempt, not the whole call: the client retries three times on top.
      # Higher than the agent's 5s because a large open-weights embedding model on
      # a shared host answers in ~10s cold, and a timeout shorter than the provider
      # burns an attempt on every single request before the retry succeeds.
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      SEARCH_DUPLICATE_THRESHOLD: ${SEARCH_DUPLICATE_THRESHOLD:-0.9}
      # prompt-conversion. On `app` only — `worker` never converts. The two
      # prices are per MILLION tokens and move with APP_AGENT_MODEL; leaving
      # them behind makes `prope_prompt_conversion_cost_usd_total` a confident
      # wrong number, which is worse than no number.
      APP_AGENT_MAX_OUTPUT_TOKENS: ${APP_AGENT_MAX_OUTPUT_TOKENS:-12000}
      APP_AGENT_PRICE_INPUT_PER_MTOK: ${APP_AGENT_PRICE_INPUT_PER_MTOK:-0.15}
      APP_AGENT_PRICE_OUTPUT_PER_MTOK: ${APP_AGENT_PRICE_OUTPUT_PER_MTOK:-0.60}
      # A compiled DSPy artifact, opt-in by path. Its demonstrations load; its
      # instructions do not — those come from the Langfuse `production` label,
      # which a human moves. See `prompt_conversion/optimize.py`.
      PROMPT_CONVERSION_DSPY_PROGRAM: ${PROMPT_CONVERSION_DSPY_PROGRAM:-}
      # prompt-search's extraction agent. On `app` this serves the index-preview
      # route only; the indexing job that runs the same agent lives in `worker`,
      # which carries the same three settings plus the Langfuse keys below.
      PROMPT_SEARCH_MAX_OUTPUT_TOKENS: ${PROMPT_SEARCH_MAX_OUTPUT_TOKENS:-2000}
      PROMPT_SEARCH_BODY_CHAR_LIMIT: ${PROMPT_SEARCH_BODY_CHAR_LIMIT:-4000}
      PROMPT_SEARCH_DSPY_PROGRAM: ${PROMPT_SEARCH_DSPY_PROGRAM:-}
      # ADR-0030's fourth pillar, and the managed conversion instruction.
      #
      # **Both keys are secrets and belong in the `0600` `.env` on the VM
      # (ADR-0032), never in CI.** Unset is supported and degrades cleanly:
      # tracing stops, and the conversion instruction falls back to the one
      # compiled into the image. `LANGFUSE_HOST` decides whether prompt METADATA
      # — never bodies — leaves the country; point it at a self-hosted or EU/VN
      # instance where PDPL cross-border rules apply.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      # **Leave this unset on any host serving a real domain.** It defaults to
      # `true`, which is ADR-0043's cookie. It exists as a variable only because a
      # host reached by bare IP has no certificate, and a browser silently discards
      # a `Secure` cookie over plain HTTP — sign-in answers 200 and every request
      # after it is a 401 with nothing in any log saying why.
      PROPE_COOKIE_SECURE: ${PROPE_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  # No published port and no healthcheck: D-17 forbids worker an HTTP surface, and
  # its compose healthcheck is process-level.
  worker:
    image: ${PROPE_IMAGE_PREFIX}/prope-app:${PROPE_IMAGE_TAG}
    command: python -m prope.worker
    environment:
      PROPE_DATABASE_URL: postgresql+asyncpg://prope_app:${PROPE_APP_PASSWORD}@postgres:5432/prope
      PROPE_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      # `worker` decrypts too — provider-access's batch dispatch runs here
      # (ADR-0049). Same variable, same rotation rule as `app` above.
      PROPE_KEK_V1: ${PROPE_KEK_V1}
      APP_OPENAI_BASE_URL: ${APP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      APP_AGENT_MODEL: ${APP_AGENT_MODEL:-gpt-4o-mini}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-3-small}
      # Embeddings are a separate product from chat, and an OpenAI-compatible
      # gateway is under no obligation to serve both: several front a dozen chat
      # models and answer 404 on `/embeddings`, which turns every semantic search
      # into a 503 no amount of retrying fixes. These three point the embedding
      # client somewhere else. Each falls back to its `APP_OPENAI_*` /
      # `APP_EMBEDDING_MODEL` counterpart when EMPTY, so a deployment using one
      # provider for everything sets none of them and behaves exactly as before.
      #
      # `EMBEDDING_MODEL` is written into every index row and every cache key, and
      # an index whose stored model is not the current one reads as STALE — so
      # changing it re-indexes the workspace rather than silently mixing vector
      # spaces that were never comparable.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Both vector columns are `vector(1536)`, so a model of any other width
      # does not store — it raises on the insert, after the call has been paid
      # for. Asked of the provider rather than sliced here: for a Matryoshka
      # model (Qwen3-Embedding is one) a 1536-wide answer is a shorter embedding,
      # not a truncated array. Set it EMPTY to omit the parameter entirely, which
      # legacy `text-embedding-ada-002` requires.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS-1536}
      # One attempt, not the whole call: the client retries three times on top.
      # Higher than the agent's 5s because a large open-weights embedding model on
      # a shared host answers in ~10s cold, and a timeout shorter than the provider
      # burns an attempt on every single request before the retry succeeds.
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      SEARCH_DUPLICATE_THRESHOLD: ${SEARCH_DUPLICATE_THRESHOLD:-0.9}
      # **prompt-search's extraction agent runs HERE, not in `app`.** The
      # indexing job is why this process consumes a queue, so the agent's token
      # budget, its cost arithmetic and its trace backend must all be present in
      # `worker` too. They were on `app` only, which is why a preview produced a
      # Langfuse trace and a real index run produced none.
      #
      # Same secrets, same `0600` `.env` on the VM (ADR-0032), same rotation
      # rule as `app`. Unset degrades cleanly: tracing stops and the extraction
      # instruction falls back to the one compiled into the image.
      APP_AGENT_PRICE_INPUT_PER_MTOK: ${APP_AGENT_PRICE_INPUT_PER_MTOK:-0.15}
      APP_AGENT_PRICE_OUTPUT_PER_MTOK: ${APP_AGENT_PRICE_OUTPUT_PER_MTOK:-0.60}
      PROMPT_SEARCH_MAX_OUTPUT_TOKENS: ${PROMPT_SEARCH_MAX_OUTPUT_TOKENS:-2000}
      PROMPT_SEARCH_BODY_CHAR_LIMIT: ${PROMPT_SEARCH_BODY_CHAR_LIMIT:-4000}
      PROMPT_SEARCH_DSPY_PROGRAM: ${PROMPT_SEARCH_DSPY_PROGRAM:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # **Bound to loopback, unlike the laptop file.** These are operator surfaces with
  # their own weak or absent authentication, and on a VM with a public address a
  # published `9090` is an unauthenticated read of every metric in the system. Reach
  # them over an SSH tunnel:  ssh -L 9090:127.0.0.1:9090 deploy@<host>
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # ADR-0033's single ingress and ADR-0052's image 2 of 2 — `caddy:2` with the Vite
  # output baked into `/srv`. It is published on 80 AND 443: set
  # `PROPE_SITE_ADDRESS` to the domain in `.env` and Caddy provisions and renews the
  # certificate itself over ACME, which needs both ports reachable from the internet.
  #
  # `caddy_data` is NOT optional once a domain is set — it holds the issued
  # certificate and the ACME account key, and losing it on every deploy means
  # re-issuing on every deploy, which is how a host reaches Let's Encrypt's rate
  # limit and then serves no TLS at all.
  caddy:
    image: ${PROPE_IMAGE_PREFIX}/prope-web:${PROPE_IMAGE_TAG}
    environment:
      PROPE_SITE_ADDRESS: ${PROPE_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
