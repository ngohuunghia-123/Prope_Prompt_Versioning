[project]
name = "prope"
version = "0.1.0"
description = "Prope — prompt registry and release-control system"
readme = "README.md"
# ADR-0026 pins the interpreter to 3.13.x. The upper bound is deliberate: a
# silent build on 3.14 against an ADR that pins 3.13.x is the failure mode.
requires-python = ">=3.13,<3.14"
dependencies = [
    # A-128 — SQLAlchemy 2.0 async over asyncpg, Alembic as guarantee carrier
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    # Hard runtime requirement of SQLAlchemy's asyncio extension (research A1).
    # Pinned explicitly so a missing bridge is a resolver error, not an import error.
    "greenlet==3.5.4",
    "alembic==1.19.1",
    # ADR-0026 — FastAPI + uvicorn + pydantic v2 is the one runtime.
    # Pinned in phase 1 (D-03); no route is built until phase 2.
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    # ADR-0003 / A-045 — prefixed ULID identifiers (call-ledger.lock.yml:297)
    "python-ulid==4.0.1",
    # ADR-0030 — structlog JSON to stdout, Prometheus metrics
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    # ADR-0028 — RabbitMQ carries the asynchronous work; aio-pika is the client
    # `docs/modules/call-ledger.lock.yml:291` names by hand.
    #
    # 9.6.2 rather than the current 10.0.1, and the reason is a risk posture
    # rather than a compatibility fact. 10.0.0's only substantive change is
    # "Update aiormq to the latest version 7" — a one-month-old MAJOR bump of
    # the low-level protocol library, on the one code path in Prope whose whole
    # purpose is durability. 9.6.2 pins `aiormq<7,>=6.8` and carries the two
    # fixes this phase leans on hardest, both landed in 9.6.0: callback-based
    # consumers now resume after a connection reconnection, and queue iterators
    # no longer raise StopAsyncIteration on channel reconnection. Revisit when
    # aiormq 7 has a track record longer than this phase.
    "aio-pika==9.6.2",
    # ADR-0021 / ADR-0043 — argon2id for human passwords, at m=47104 KiB, t=1,
    # p=1, with every argument named at the construction site.
    #
    # PINNED, and the pin is the decision rather than the habit. `argon2-cffi`'s
    # own defaults (t=3, m=64 MiB, p=4) are wrong for ADR-0033's 4-vCPU host in
    # two of their three terms, and they have already changed once between
    # releases — so a floating version is one that can silently move the cost of
    # every login on the box the gateway is served from, in either direction.
    # The lock file says `>= 23.1, PINNED`; this is the pin.
    #
    # It is the only dependency in this file that pulls a C extension
    # (`argon2-cffi-bindings` -> `cffi` -> `pycparser`). That is the point: a
    # pure-Python argon2 would be slow in the wrong way — slow per unit of
    # attacker cost rather than per unit of defender memory.
    "argon2-cffi==25.1.0",
    # ADR-0047 — every upstream call goes through httpx with a transport that
    # connects to the address the SSRF guard validated, while the hostname is
    # preserved for TLS SNI and certificate verification. Redirects disabled, no
    # retry configured anywhere (A-088 by construction).
    "httpx==0.28.1",
    # ADR-0014 — AES-GCM for the per-credential data key and for wrapping it
    # under the KEK held outside the database (ADR-0032, A-135).
    "cryptography==50.0.0",
    # evaluation, T-009 — a SECURITY dependency rather than a convenience.
    #
    # A-005 makes `regex` one of the eight assertion types a PROMPT OWNER
    # authors, so the pattern is user-supplied code running in `worker`. Stdlib
    # `re` has no timeout and holds the GIL in C without yielding, so one
    # catastrophic-backtracking pattern would stall not just its own eval case
    # but call-ledger's drain, call-ledger's retention job and
    # provider-access's batch dispatch, which share that process as of
    # ADR-0049. This module's `regex.Pattern.search(..., timeout=1.0)` checks
    # the deadline periodically and raises instead of running to completion.
    # `docs/modules/evaluation.lock.yml` names the library by hand and says the
    # stdlib is refused; a test asserts `re` is not imported on the assertion
    # path.
    "regex==2026.1.15",
    # A-005's JSON-schema assertion type, named by the lock's step-4 stack pass
    # as the one assertion that had no library: pydantic v2 EMITS JSON Schema
    # but does not validate an arbitrary externally-authored one, and the schema
    # here is authored by the prompt owner.
    "jsonschema==4.26.0",
    # prompt-search: app-owned metadata extraction and embeddings
    "openai==2.53.0",
    # prompt-conversion — `domain.py` parses YAML source at RUNTIME.
    #
    # `pyyaml` was in the dev group only, where it was pinned so that an
    # alert-rules TEST would not depend on `uvicorn[standard]`'s extra list. That
    # reasoning does not carry a runtime import: `normalize_source()` calls
    # `yaml.safe_load` on every `source_format="yaml"` conversion, on the `app`
    # image, which installs no dev group. Declared here as well; uv resolves the
    # two identical pins to one wheel, and the dev-group line stays because the
    # test's reason for pinning it is still true.
    "pyyaml==6.0.3",
    # prompt-ingestion — multipart admission and bounded XLSX value extraction.
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",
    # ADR-0030's fourth pillar for the one module that has an LLM in its path.
    #
    # `prompt_conversion.telemetry` has imported `langfuse` at module scope since
    # the module was written, and `src/prope/app.py:167` imports the conversion
    # router — so an install that resolves this file and nothing else could not
    # import the application at all. It only ever worked because the package was
    # hand-installed into `.venv`; `uv sync` would have removed it.
    #
    # Langfuse is a COMPLEMENT to Prometheus, not a replacement (ADR-0030 stands):
    # Prometheus keeps the low-cardinality series an alert rule can be written
    # against, Langfuse keeps the per-request span tree and the prompt registry
    # that a human promotes a conversion instruction through. The integration is
    # deliberately soft — `get_langfuse()` returns `None` with no keys set, and
    # every call site tolerates it — because a conversion must not fail on its
    # observability backend.
    "langfuse==4.14.4",
    # prompt-conversion's agent program (see `prompt_conversion/dspy_program.py`).
    #
    # DSPy is here for what a hand-written `chat.completions.create` cannot give:
    # the conversion instruction, the typed output contract and the few-shot
    # demonstrations are ONE optimizable artifact that `optimize.py` can compile
    # against a golden set and `evaluation.py` can score — instead of a prompt
    # string somebody edits and nobody measures.
    #
    # It does NOT get to promote its own work. The optimizer writes a candidate
    # to Langfuse as an UNLABELLED prompt version; a human moves the `production`
    # label. That is the same non-negotiable Prope sells to its users, applied to
    # Prope's own agent.
    "dspy==3.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# D-01 — one installable `prope` package, src-layout, each bounded context a
# subpackage (src/prope/call_ledger/) mirroring schema-per-module one-to-one.
# Horizontal models/ services/ api/ layering is rejected by the module map.
[tool.hatch.build.targets.wheel]
packages = ["src/prope"]
